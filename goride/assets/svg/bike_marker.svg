<svg width="40" height="80" viewBox="0 0 40 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g filter="url(#shadow)">
    <!-- Main Body/Frame -->
    <rect x="18" y="16" width="4" height="48" rx="2" fill="#0F172A"/>
    <!-- Front Wheel -->
    <rect x="18" y="8" width="4" height="16" rx="2" fill="#334155"/>
    <!-- Rear Wheel -->
    <rect x="18" y="56" width="4" height="16" rx="2" fill="#334155"/>
    <!-- Handlebars -->
    <rect x="10" y="20" width="20" height="4" rx="2" fill="#475569"/>
    <!-- Seat -->
    <rect x="15" y="40" width="10" height="12" rx="4" fill="#0F172A"/>
    <!-- Delivery Box -->
    <rect x="10" y="56" width="20" height="18" rx="3" fill="#22C55E"/>
    <!-- Headlight -->
    <circle cx="20" cy="8" r="3" fill="#FACC15"/>
  </g>
  <defs>
    <filter id="shadow" x="0" y="0" width="40" height="80" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
</svg>
